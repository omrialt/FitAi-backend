# Nothing checked this repo before a deploy. Deploys are push-to-deploy
# straight to Vercel, so a broken build, a type error or a failing test only
# surfaced in production. The tests already existed and passed; they just never
# gated anything.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node that Vercel runs the functions on.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fail on known critical advisories in runtime dependencies (security:
      # SEC-04). `critical` rather than `high` until zod 3 -> 4 lands: the only
      # remaining high advisory is zod's oversized-input DoS (bounded here by
      # the 100kb body limit), and @anatine / @zodyac pin zod 3. Raise this to
      # `high` with that migration.
      - name: Audit
        run: npm audit --omit=dev --audit-level=critical

      # Not `npm run lint`: that script passes --fix, which would "pass" by
      # rewriting the working tree instead of reporting anything.
      #
      # Blocking since the baseline was cleared (gap analysis rev. 17). It was
      # non-blocking while ~140 old problems would have made every PR red on
      # day one; with zero, a new problem is a new problem.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test

      # Last, because it is the slowest and a type error usually shows up in
      # the tests first.
      - name: Build
        run: npm run build
